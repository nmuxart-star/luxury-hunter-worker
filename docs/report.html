<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>
<meta name="color-scheme" content="dark">
<title>Luxury Hunter · Informe</title>

<style>
:root{
  --bg:#090d12;
  --panel:#0f141b;
  --panel2:#151326;
  --line:#2b3441;
  --text:#f7f7fb;
  --muted:#9ca7b8;
  --purple:#c4b5fd;
  --green:#6ee7b7;
  --red:#fb7185;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

a{color:var(--purple)}

.wrap{
  width:min(1180px,calc(100% - 32px));
  margin:0 auto;
  padding:34px 0 70px;
}

.brand{
  color:var(--muted);
  font-size:14px;
  margin-bottom:8px;
}

h1{
  margin:0;
  font-size:31px;
}

h2{
  margin:0 0 14px;
  font-size:17px;
  color:var(--purple);
  text-transform:uppercase;
}

h3{
  margin:22px 0 9px;
}

.muted{color:var(--muted)}

.hero{
  display:grid;
  grid-template-columns:190px 1fr 245px;
  gap:24px;
  align-items:start;
  margin-top:28px;
}

.hero-img{
  width:190px;
  height:190px;
  object-fit:cover;
  border-radius:16px;
  border:1px solid var(--line);
  background:#111827;
}

.card{
  border:1px solid var(--line);
  background:var(--panel);
  padding:20px;
  border-radius:16px;
  margin-top:18px;
}

.card.purple{
  background:var(--panel2);
  border-color:#6545a8;
}

.card.green{
  background:#0d1916;
  border-color:#176448;
}

.pill{
  display:inline-block;
  padding:5px 9px;
  border:1px solid #3b4655;
  border-radius:999px;
  font-size:12px;
  margin:0 6px 6px 0;
}

.btn{
  display:inline-block;
  padding:10px 14px;
  border-radius:9px;
  background:#252d39;
  color:#fff;
  text-decoration:none;
  font-weight:700;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(170px,1fr));
  gap:10px;
}

.stat{
  border:1px solid var(--line);
  background:#090e14;
  border-radius:12px;
  padding:13px;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:13px;
}

.stat b{
  display:block;
  margin-top:6px;
  font-size:19px;
}

.kv{
  display:grid;
  grid-template-columns:1fr auto;
  gap:14px;
  padding:9px 0;
  border-bottom:1px solid var(--line);
}

.kv:last-child{
  border-bottom:0;
}

.kv span{
  color:var(--muted);
}

.ref{
  border:1px solid var(--line);
  background:#090e14;
  border-radius:12px;
  padding:14px;
  margin-top:9px;
}

.ref-head{
  display:flex;
  justify-content:space-between;
  gap:14px;
}

ul,ol{
  padding-left:20px;
}

li{
  margin:6px 0;
}

.big{
  font-size:23px;
  font-weight:800;
  margin:4px 0 16px;
}

.empty{
  margin-top:24px;
  border:1px solid var(--line);
  border-radius:16px;
  padding:30px;
  color:var(--muted);
}

@media(max-width:820px){
  .hero{
    grid-template-columns:1fr;
  }

  .hero-img{
    width:160px;
    height:160px;
  }

  .kv{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>
<main class="wrap">
  <div class="brand">Luxury Hunter</div>
  <h1>Informe del producto</h1>

  <div id="content">
    <div class="empty">
      Cargando informe…
    </div>
  </div>
</main>

<script>
function esc(v){
  return String(v??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#39;");
}

function n(v){
  const x=Number(v);
  return Number.isFinite(x)?x:null;
}

function eur(v){
  const x=n(v);

  if(x===null)return '—';

  return new Intl.NumberFormat(
    'es-ES',
    {
      style:'currency',
      currency:'EUR',
      maximumFractionDigits:2
    }
  ).format(x);
}

function pct(v){
  const x=n(v);

  if(x===null)return '—';

  return `${Math.round(x<=1?x*100:x)}%`;
}

function decode(){
  let s=location.hash.slice(1);

  if(!s){
    throw new Error(
      'El enlace no contiene los datos del informe.'
    );
  }

  s=s
    .replaceAll('-','+')
    .replaceAll('_','/');

  while(s.length%4){
    s+='=';
  }

  const raw=atob(s);
  const bytes=new Uint8Array(raw.length);

  for(let i=0;i<raw.length;i++){
    bytes[i]=raw.charCodeAt(i);
  }

  return JSON.parse(
    new TextDecoder().decode(bytes)
  );
}

function list(arr){
  const a=Array.isArray(arr)
    ? arr.filter(Boolean)
    : [];

  if(!a.length){
    return '<div class="muted">Sin datos.</div>';
  }

  return `<ul>${
    a.map(x=>`<li>${esc(x)}</li>`).join('')
  }</ul>`;
}

function economicRows(obj){
  const e=obj&&typeof obj==='object'
    ? obj
    : {};

  const labels={
    productEur:'Precio producto',
    domesticShippingEur:'Envío doméstico',
    agentFeeEur:'Agente / proxy',
    internationalShippingEur:'Envío internacional',
    customsDutyEur:'Arancel / aduanas',
    vatEur:'IVA importación',
    clearanceFeeEur:'Gestión aduanera / courier',
    authenticationFeeEur:'Autenticación',
    otherEur:'Otros costes',
    importedTotalEur:'Precio final importado'
  };

  return Object.entries(e)
    .filter(([k,v])=>
      n(v)!==null &&
      (
        k.endsWith('Eur') ||
        k==='importedTotalEur'
      )
    )
    .map(([k,v])=>`
      <div class="kv">
        <span>${esc(labels[k]||k)}</span>
        <b>${eur(v)}</b>
      </div>
    `)
    .join('') ||
    '<div class="muted">Sin desglose disponible.</div>';
}

function refs(arr){
  const r=Array.isArray(arr)?arr:[];

  if(!r.length){
    return '<div class="muted">No hay referencias guardadas.</div>';
  }

  return r.map(x=>{
    const date=
      x.sold_date
        ? `Vendido: ${x.sold_date}`
        : x.listing_date
          ? `Publicado: ${x.listing_date}`
          : x.date_text
            ? `Fecha: ${x.date_text}`
            : 'Fecha no disponible';

    const price=
      n(x.price_eur)!==null
        ? eur(x.price_eur)
        : n(x.price)!==null
          ? `${x.price} ${esc(x.currency||'')}`
          : 'Precio no disponible';

    return `
      <div class="ref">
        <div class="ref-head">
          <div>
            <b>${esc(x.source||'Fuente')}</b>
            <div class="muted">
              ${esc(x.title||'Sin título')}
            </div>
          </div>

          <span class="pill">
            ${esc(x.match_level||'UNKNOWN')}
          </span>
        </div>

        <div style="margin-top:8px">
          <span class="pill">
            ${esc(x.listing_status||'UNKNOWN')}
          </span>

          <span class="pill">
            ${price}
          </span>

          <span class="pill">
            ${esc(date)}
          </span>
        </div>

        ${
          x.match_reason_es
            ? `<div
                class="muted"
                style="margin-top:8px"
               >
                ${esc(x.match_reason_es)}
               </div>`
            : ''
        }

        ${
          x.url
            ? `<div style="margin-top:9px">
                <a
                  href="${esc(x.url)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Abrir referencia ↗
                </a>
               </div>`
            : ''
        }
      </div>
    `;
  }).join('');
}

function render(p){
  const l=p.listing||{};
  const a=p.analysis||{};
  const mp=p.marketplace||{};
  const ex=p.exact||{};
  const c=p.condition||{};
  const m=p.market||{};

  const resaleSource=String(
    m.resale_estimate_source||''
  ).toUpperCase();

  const resaleConfidence=String(
    m.resale_estimate_confidence ||
    m?.ai_resale_estimate?.confidence ||
    'LOW'
  ).toUpperCase();

  const resaleSourceLabel=
    resaleSource==='MARKET_ANALYSIS'
      ? 'ANÁLISIS DE MERCADO'
      : resaleSource==='AI_ESTIMATE'
        ? `ESTIMACIÓN IA · confianza ${resaleConfidence}`
        : 'ORIGEN NO DISPONIBLE';

  const resale=
    n(a.resale_low_eur)!==null ||
    n(a.resale_high_eur)!==null
      ? `${eur(a.resale_low_eur)} – ${
          eur(a.resale_high_eur)
        }`
      : 'Sin estimación verificada';

  const profit=
    n(a.profit_low_eur)!==null ||
    n(a.profit_high_eur)!==null
      ? `${eur(a.profit_low_eur)} – ${
          eur(a.profit_high_eur)
        }`
      : 'Sin estimación verificada';

  const marketVerified=
    String(m.confidence||'LOW').toUpperCase()==='HIGH' &&
    Number(m.relevant_comps||0)>=3 &&
    Number(m.sources||0)>=2;

  document.getElementById('content').innerHTML=`
    <section class="hero">
      <div>
        ${
          l.image_url
            ? `<img
                class="hero-img"
                src="${esc(l.image_url)}"
                alt=""
              >`
            : ''
        }
      </div>

      <div>
        <div>
          <span class="pill">${esc(l.source||'')}</span>
          ${
            p.task?.name
              ? `<span class="pill">${
                  esc(p.task.name)
                }</span>`
              : ''
          }
          ${
            a.decision
              ? `<span class="pill">${
                  esc(a.decision)
                }</span>`
              : ''
          }
        </div>

        <h1 style="margin-top:8px">
          ${esc(l.title||'(sin título)')}
        </h1>

        ${
          l.seller_name
            ? `<div
                class="muted"
                style="margin-top:8px"
               >
                ${esc(l.seller_name)}
               </div>`
            : ''
        }

        ${
          l.url
            ? `<div style="margin-top:16px">
                <a
                  class="btn"
                  href="${esc(l.url)}"
                  target="_blank"
                >
                  Abrir anuncio
                </a>
               </div>`
            : ''
        }
      </div>

      <aside>
        <div class="muted">Precio anuncio</div>
        <div class="big">
          ${
            l.original_price!=null
              ? `${esc(l.original_price)} ${
                  esc(l.currency||'')
                }`
              : '—'
          }
        </div>

        <div class="muted">Conversión</div>
        <div class="big">${eur(l.price_eur)}</div>

        <div class="muted">Final importado</div>
        <div class="big">
          ${eur(a.landed_cost_eur)}
        </div>

        <div class="muted">Reventa · ${esc(resaleSourceLabel)}</div>
        <div class="big">${resale}</div>

        <div class="muted">
          Beneficio tras reventa
        </div>
        <div class="big">${profit}</div>
      </aside>
    </section>

    <section class="card green">
      <h2>
        Control de autenticidad del marketplace
      </h2>

      <div style="font-size:18px;font-weight:800">
        ${
          mp.service
            ? `${esc(mp.service)}: ${
                esc(mp.status||'UNKNOWN')
              }`
            : 'No aplica'
        }
      </div>

      <div
        class="muted"
        style="margin-top:8px"
      >
        Confianza:
        ${esc(mp.confidence||'—')}
      </div>

      ${list(mp.evidence_es)}
    </section>

    <section class="card purple">
      <h2>
        ${
          marketVerified
            ? 'Exact model verified · Market verified'
            : 'Exact model verified · Market inconclusive'
        }
      </h2>

      <div style="
        font-size:19px;
        font-weight:800;
      ">
        ${esc(ex.label||'—')}
        · visual confidence
        ${pct(ex.confidence)}
      </div>

      <div style="margin-top:8px">
        ${
          [
            ex.size,
            ex.material,
            ex.color,
            ex.pattern
          ]
            .filter(Boolean)
            .map(esc)
            .join(' · ')
        }
      </div>

      <div style="margin-top:10px">
        Market:
        <b>${esc(m.confidence||'LOW')}</b>
        · ${Number(m.relevant_comps||0)}
        relevant comps
        · ${Number(m.sources||0)} sources
      </div>

      <div style="margin-top:8px">
        Condition:
        <b>${esc(c.grade||'UNKNOWN')}</b>
        ${
          n(c.score)!==null
            ? ` · ${Math.round(c.score)}/100`
            : ''
        }
        · confidence ${pct(c.confidence)}
      </div>

      <div style="margin-top:8px">
        Condition market:
        <b>
          ${esc(m.condition_confidence||'LOW')}
        </b>
        · ${Number(m.condition_comps||0)}
        condition-matched comps
        · ${Number(m.condition_sources||0)}
        sources
      </div>

      <div
        class="grid"
        style="margin-top:18px"
      >
        <div class="stat">
          <span>Rondas de búsqueda</span>
          <b>${Number(m.search_passes||0)}</b>
        </div>

        <div class="stat">
          <span>Resultados encontrados</span>
          <b>${Number(m.results_found||0)}</b>
        </div>

        <div class="stat">
          <span>Google Vision</span>
          <b>
            ${
              m.vision_ok
                ? `OK · ${
                    Number(m.vision_candidates||0)
                  }`
                : 'Sin datos'
            }
          </b>
        </div>

        <div class="stat">
          <span>Score</span>
          <b>
            ${
              a.score!=null
                ? `${a.score}/100`
                : '—'
            }
          </b>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Informe de calidad</h2>

      <div class="grid">
        <div class="stat">
          <span>Estado</span>
          <b>${esc(c.grade||'UNKNOWN')}</b>
        </div>

        <div class="stat">
          <span>Score visual</span>
          <b>
            ${
              n(c.score)!==null
                ? `${Math.round(c.score)}/100`
                : '—'
            }
          </b>
        </div>

        <div class="stat">
          <span>Confianza</span>
          <b>${pct(c.confidence)}</b>
        </div>
      </div>

      <h3>Defectos visibles</h3>
      ${list(c.defects_es)}

      <h3>Señales positivas</h3>
      ${list(c.positive_signals_es)}

      <h3>Áreas visibles</h3>
      ${list(c.visible_areas_es)}

      <h3>Vistas que faltan</h3>
      ${list(c.missing_views_es)}
    </section>

    <section class="card">
      <h2>
        Coste estimado importado a España
      </h2>

      ${economicRows(p.import_costs)}

      <div style="margin-top:18px">
        <div class="kv">
          <span>Reventa estimada · ${esc(resaleSourceLabel)}</span>
          <b>${resale}</b>
        </div>

        <div class="kv">
          <span>Beneficio tras reventa</span>
          <b>${profit}</b>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Análisis del mercado</h2>

      <div class="muted">
        Chequeo:
        ${esc(m.checked_at||'No disponible')}
      </div>

      ${
        m.vision_error
          ? `<div
              style="
                margin-top:8px;
                color:var(--red);
              "
             >
              Google Vision:
              ${esc(m.vision_error)}
             </div>`
          : ''
      }

      <h3>Queries ejecutadas</h3>

      ${
        Array.isArray(m.queries) &&
        m.queries.length
          ? `<ol>${
              m.queries
                .map(q=>`<li>${esc(q)}</li>`)
                .join('')
            }</ol>`
          : '<div class="muted">No hay queries guardadas.</div>'
      }

      <h3>Referencias encontradas</h3>

      ${refs(m.references)}
    </section>

    <section class="card">
      <h2>Identificación visual</h2>

      <h3>Evidencia visual</h3>
      ${list(ex.visual_evidence_es)}

      <h3>Incertidumbres</h3>
      ${list(ex.uncertainties_es)}
    </section>
  `;
}

try{
  render(decode());
}catch(e){
  document.getElementById('content').innerHTML=`
    <div class="empty">
      No se pudo abrir el informe:
      ${esc(e.message)}
    </div>
  `;
}
</script>
</body>
</html>
