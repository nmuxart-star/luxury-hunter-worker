name: Xianyu verificación remota

# Abre en el servidor propio una ventana de Goofish con la sesión del bot y la
# muestra por un escritorio remoto web (enlace temporal + contraseña) que se
# envía por Telegram. La verificación la resuelve Nil a mano. Al terminar, la
# sesión resultante se cifra y se sube a cloud/xianyu-state.enc.
# El enlace y la contraseña NUNCA van al log (el repositorio es público).
on:
  workflow_dispatch:
    inputs:
      minutos:
        description: 'Minutos que se mantiene abierta la ventana (2-25)'
        default: '15'

permissions:
  contents: write

concurrency:
  group: xianyu-captcha-remoto
  cancel-in-progress: false

jobs:
  remoto:
    # Tiene que ser el servidor del bot: la verificación depende de su IP.
    runs-on: ${{ vars.LH_RUNNER }}
    timeout-minutes: 35
    env:
      XIANYU_STATE_PASSWORD: ${{ secrets.XIANYU_STATE_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MINUTOS: ${{ inputs.minutos }}
    steps:
      - uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Install remote desktop tools
        shell: bash
        run: |
          MISSING=""
          for c in Xvfb x11vnc websockify; do command -v "$c" >/dev/null 2>&1 || MISSING=1; done
          [ -d /usr/share/novnc ] || MISSING=1
          if [ -n "$MISSING" ]; then
            sudo apt-get update -y >/dev/null
            sudo apt-get install -y xvfb x11vnc novnc websockify >/dev/null
          fi
          if ! command -v cloudflared >/dev/null 2>&1 && [ ! -x "$RUNNER_TEMP/cloudflared" ]; then
            case "$(uname -m)" in aarch64|arm64) A=arm64;; *) A=amd64;; esac
            curl -fsSL -o "$RUNNER_TEMP/cloudflared" "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-$A"
            chmod +x "$RUNNER_TEMP/cloudflared"
          fi
          echo "Herramientas listas."

      - name: Decrypt Xianyu session
        shell: bash
        run: |
          [ -f cloud/xianyu-state.enc ] || { echo "Falta cloud/xianyu-state.enc" >&2; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -in cloud/xianyu-state.enc -out "$RUNNER_TEMP/Nil.json" -pass env:XIANYU_STATE_PASSWORD

      - name: Open remote window and wait for the verification to be solved
        id: remote
        shell: bash
        run: |
          set +x
          PW="$(LC_ALL=C tr -dc 'a-km-zA-HJ-NP-Z2-9' </dev/urandom | head -c 8)"
          echo "::add-mask::$PW"
          CF="$(command -v cloudflared || echo "$RUNNER_TEMP/cloudflared")"
          DISPLAY_NUM=97
          export DISPLAY=":$DISPLAY_NUM"
          PIDS=""
          cleanup(){ for p in $PIDS; do kill "$p" 2>/dev/null || true; done; }
          trap cleanup EXIT

          Xvfb "$DISPLAY" -screen 0 1280x800x24 >/dev/null 2>&1 & PIDS="$PIDS $!"
          sleep 2
          x11vnc -display "$DISPLAY" -localhost -rfbport 5997 -passwd "$PW" -forever -shared -noxdamage -quiet >"$RUNNER_TEMP/x11vnc.log" 2>&1 & PIDS="$PIDS $!"
          websockify --web /usr/share/novnc 6097 localhost:5997 >"$RUNNER_TEMP/websockify.log" 2>&1 & PIDS="$PIDS $!"
          "$CF" tunnel --no-autoupdate --url http://localhost:6097 >"$RUNNER_TEMP/cloudflared.log" 2>&1 & PIDS="$PIDS $!"

          URL=""
          for i in $(seq 1 40); do
            URL="$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' "$RUNNER_TEMP/cloudflared.log" | head -1 || true)"
            [ -n "$URL" ] && break
            sleep 1
          done
          if [ -z "$URL" ]; then echo "No se pudo abrir el enlace temporal." >&2; echo "result=error" >> "$GITHUB_OUTPUT"; exit 1; fi
          echo "::add-mask::$URL"

          TEXT="🖥️ Verificación de Xianyu en el servidor. Abre este enlace, pulsa Conectar e introduce la contraseña: ${URL}/vnc.html?autoconnect=0&resize=scale  ·  Contraseña: ${PW}  ·  Verás una ventana de Chromium (tarda ~20 s en cargar). Resuelve el captcha si aparece y no cierres nada: se cierra sola cuando termina o a los ${MINUTOS:-15} min."
          curl -s -o /dev/null -w "Telegram HTTP %{http_code}\n" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$TEXT"

          node scripts/xianyu-remote-captcha.mjs "$RUNNER_TEMP/Nil.json" "${MINUTOS:-15}" || true

          case "$(grep -h '^result=' "$GITHUB_OUTPUT" | tail -1)" in
            result=ok) MSG="✅ Xianyu: verificación superada en el servidor. La sesión se está guardando; ya puedes lanzar el bot.";;
            result=timeout) MSG="⏱️ Xianyu: no se completó la verificación a tiempo. No se ha guardado nada.";;
            *) MSG="⚠️ Xianyu: error al abrir la ventana remota. No se ha guardado nada.";;
          esac
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$MSG"

      - name: Save the new session
        if: steps.remote.outputs.result == 'ok'
        shell: bash
        run: |
          openssl enc -aes-256-cbc -salt -pbkdf2 -in "$RUNNER_TEMP/Nil.json" -out cloud/xianyu-state.enc -pass env:XIANYU_STATE_PASSWORD
          git config user.name "xianyu-captcha-remoto"
          git config user.email "actions@users.noreply.github.com"
          git add cloud/xianyu-state.enc
          git commit -m "Xianyu: sesión renovada tras resolver la verificación en el servidor" || { echo "Sin cambios."; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"
