name: Luxury Hunter hourly

on:
  workflow_dispatch:
    inputs:
      force_digest:
        description: 'Enviar el resumen (email + Telegram) en esta ejecución'
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: luxury-hunter-scheduled
  cancel-in-progress: false

jobs:
  hunt:
    # LH_RUNNER=lh-vps ejecuta el bot en el servidor propio (runner autoalojado).
    runs-on: ${{ vars.LH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 355
    env:
      # IA: OpenAI si existe OPENAI_API_KEY; si no, Gemini.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6.1-sol' }}
      OPENAI_TRIAGE_MODEL: ${{ vars.OPENAI_TRIAGE_MODEL || 'gpt-6-luna' }}
      AI_TRIAGE_MIN_SCORE: ${{ vars.AI_TRIAGE_MIN_SCORE || '50' }}
      # Tope de gasto diario en OpenAI (USD). Al alcanzarlo se deja de analizar hasta mañana.
      AI_DAILY_BUDGET_USD: ${{ vars.AI_DAILY_BUDGET_USD || '0.75' }}
      AI_VERIFY_DAILY_BUDGET_USD: ${{ vars.AI_VERIFY_DAILY_BUDGET_USD || '0.4' }}
      AI_SPEND_RESET: ${{ vars.AI_SPEND_RESET || '' }}
      AI_MONTHLY_BUDGET_USD: ${{ vars.AI_MONTHLY_BUDGET_USD || '20' }}
      AI_MONTH_SPENT_RESET: ${{ vars.AI_MONTH_SPENT_RESET || '' }}
      # Verificación cara (fotos + búsqueda web) solo para BUY/STRONG BUY o WATCH con esta puntuación.
      VERIFY_WATCH_MIN_SCORE: ${{ vars.VERIFY_WATCH_MIN_SCORE || '60' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Fuentes por API oficial (se activan solas si existen los secretos).
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_MARKETPLACES: ${{ vars.EBAY_MARKETPLACES || 'EBAY_DE,EBAY_FR,EBAY_IT,EBAY_ES,EBAY_GB,EBAY_US' }}
      # 'cost' (prudente) o 'deductible' si la empresa deduce el IVA de importación.
      IMPORT_VAT_MODE: ${{ vars.IMPORT_VAT_MODE || 'cost' }}
      GOOGLE_CLOUD_VISION_API_KEY: ${{ secrets.GOOGLE_CLOUD_VISION_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      # Base de datos de Vestiaire de Nil (Google Sheets), solo lectura con cuenta de servicio.
      VESTIAIRE_SHEET_ID: ${{ secrets.VESTIAIRE_SHEET_ID }}
      GOOGLE_SHEETS_SA_JSON: ${{ secrets.GOOGLE_SHEETS_SA_JSON }}
      VESTIAIRE_SHEET_REFRESH_MIN: ${{ vars.VESTIAIRE_SHEET_REFRESH_MIN || '30' }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      JUSTONEAPI_TOKEN: ${{ secrets.JUSTONEAPI_TOKEN }}
      XIANYU_BASE_URL: http://127.0.0.1:8000
      XIANYU_PROVIDER: ${{ vars.XIANYU_PROVIDER == 'direct' && 'direct' || 'justoneapi' }}
      XIANYU_JUSTONE_SORT: ${{ vars.XIANYU_JUSTONE_SORT || 'active' }}
      XIANYU_DETAIL_PER_HOUR: ${{ vars.XIANYU_DETAIL_PER_HOUR || '4' }}
      # Xianyu: una comprobación cada 3 h. Just One API: 1 consulta; modo directo: 2.
      XIANYU_MAX_QUERIES: ${{ vars.XIANYU_MAX_QUERIES || (vars.XIANYU_PROVIDER == 'direct' && '2' || '1') }}
      XIANYU_MIN_INTERVAL_MIN: ${{ vars.XIANYU_MIN_INTERVAL_MIN || '180' }}
      XIANYU_QUERY_TIMEOUT_SEC: ${{ vars.XIANYU_QUERY_TIMEOUT_SEC || '180' }}
      BUNJANG_MAX_QUERIES: ${{ vars.BUNJANG_MAX_QUERIES || '2' }}
      BUYEE_MAX_QUERIES: ${{ vars.BUYEE_MAX_QUERIES || '2' }}
      PORT: '8200'
      # Velocidad: tareas en paralelo y ciclos repetidos dentro de cada ejecución.
      TASK_CONCURRENCY: ${{ vars.TASK_CONCURRENCY || '3' }}
      LOOP_MINUTES: ${{ vars.LOOP_MINUTES || '0' }}
      CYCLE_MIN_MINUTES: ${{ vars.CYCLE_MIN_MINUTES || '20' }}
      # Avisos inmediatos (email siempre; Telegram si hay secretos).
      INSTANT_ALERT_DECISIONS: ${{ vars.INSTANT_ALERT_DECISIONS || 'STRONG BUY,BUY' }}
      INSTANT_ALERT_MIN_PROFIT_EUR: ${{ vars.INSTANT_ALERT_MIN_PROFIT_EUR || '' }}
      AI_MAX_ITEMS_PER_TASK_RUN: ${{ vars.AI_MAX_ITEMS_PER_TASK_RUN || '10' }}
      # Informe: uno al día a partir de esta hora (Europe/Madrid).
      DIGEST_SCHEDULE: ${{ vars.DIGEST_SCHEDULE || 'daily' }}
      DIGEST_DAILY_HOUR: ${{ vars.DIGEST_DAILY_HOUR || '9' }}
      GLOBAL_EMAIL_TO: ${{ secrets.GLOBAL_EMAIL_TO }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      XIANYU_MODE: ${{ vars.XIANYU_MODE }}
      FORCE_DIGEST: ${{ inputs.force_digest && '1' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Decrypt Luxury Hunter cloud configuration
        env:
          LUXURY_CONFIG_PASSWORD: ${{ secrets.LUXURY_CONFIG_PASSWORD }}
        shell: bash
        run: |
          if [ ! -f cloud/config.enc ]; then
            echo "Missing cloud/config.enc" >&2
            exit 1
          fi
          if [ -z "${LUXURY_CONFIG_PASSWORD:-}" ]; then
            echo "Missing GitHub secret LUXURY_CONFIG_PASSWORD" >&2
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -in cloud/config.enc -out cloud/config.json -pass env:LUXURY_CONFIG_PASSWORD

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # En el servidor propio no viene instalado el CLI de GitHub, que hace
      # falta para recuperar el estado (memoria, avisos enviados, gasto IA).
      - name: Ensure GitHub CLI
        shell: bash
        run: |
          if command -v gh >/dev/null 2>&1; then gh --version | head -1; exit 0; fi
          sudo mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg >/dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
          sudo apt-get update -y >/dev/null && sudo apt-get install -y gh >/dev/null
          gh --version | head -1

      - name: Restore previous Luxury Hunter state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p .state data
          RESTORED_RUN=""

          for PREV_RUN in $(gh run list --workflow luxury-hunter.yml --limit 20 --json databaseId -q '.[].databaseId' 2>/dev/null || true); do
            if [ "$PREV_RUN" = "${GITHUB_RUN_ID:-}" ]; then
              continue
            fi

            rm -rf .state/*

            if gh run download "$PREV_RUN" -n luxury-hunter-state -D .state >/dev/null 2>&1; then
              if [ -f .state/luxury-hunter.sqlite3 ]; then
                cp .state/luxury-hunter.sqlite3 data/luxury-hunter.sqlite3
                RESTORED_RUN="$PREV_RUN"
                echo "Restored persistent state from run $PREV_RUN"
                break
              fi
            fi
          done

          if [ -z "$RESTORED_RUN" ]; then
            echo "::warning::No previous persistent state artifact was available."
            exit 0
          fi
          # Por si alguna ejecución anterior arrancó sin memoria: se juntan los
          # avisos enviados, análisis y valoraciones de las últimas ejecuciones.
          mkdir -p .merge
          N=0
          for PREV_RUN in $(gh run list --workflow luxury-hunter.yml --limit 12 --json databaseId -q '.[].databaseId' 2>/dev/null || true); do
            [ "$PREV_RUN" = "${GITHUB_RUN_ID:-}" ] && continue
            [ "$PREV_RUN" = "$RESTORED_RUN" ] && continue
            [ $N -ge 5 ] && break
            if gh run download "$PREV_RUN" -n luxury-hunter-state -D ".merge/$PREV_RUN" >/dev/null 2>&1 && [ -f ".merge/$PREV_RUN/luxury-hunter.sqlite3" ]; then
              N=$((N+1))
            fi
          done
          if [ $N -gt 0 ]; then
            node scripts/merge-state.mjs data/luxury-hunter.sqlite3 .merge/*/luxury-hunter.sqlite3 || echo "merge-state failed (continuing)"
          fi
          rm -rf .merge

      - name: Install Luxury Hunter dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for Bunjang
        run: npx playwright install --with-deps chromium

      - name: Start Xianyu connector when encrypted state is configured
        env:
          XIANYU_STATE_PASSWORD: ${{ secrets.XIANYU_STATE_PASSWORD }}
          XIANYU_MODE: ${{ vars.XIANYU_MODE }}
          XIANYU_PROVIDER: ${{ vars.XIANYU_PROVIDER == 'direct' && 'direct' || 'justoneapi' }}
        shell: bash
        run: |
          if [ "${XIANYU_PROVIDER:-justoneapi}" != "direct" ]; then
            echo "XIANYU_SESSION_STATUS=not_required" >> "$GITHUB_ENV"
            echo "Just One API selected; skipping Xianyu browser sessions and connector."
            exit 0
          fi
          shopt -s nullglob
          ACCOUNT_ENC=(cloud/xianyu-state.enc cloud/xianyu-accounts/*.enc)
          if [ ${#ACCOUNT_ENC[@]} -eq 0 ] || [ -z "${XIANYU_STATE_PASSWORD:-}" ]; then
            echo "No Xianyu session configured; direct mode will attempt public search without login."
            echo "XIANYU_SESSION_STATUS=missing" >> "$GITHUB_ENV"
            exit 0
          fi
          git clone --depth 1 https://github.com/wangdaguo/ai-goofish-monitor.git .xianyu || mkdir -p .xianyu
          mkdir -p .xianyu/state .xianyu/data .xianyu/logs .xianyu/images .xianyu/jsonl .xianyu/price_history .xianyu-tmp
          # Cada cuenta conserva su propio state. Para Nil se mantiene el formato
          # antiguo y así no se pierden los inicios de sesión ya configurados.
          for ENC in "${ACCOUNT_ENC[@]}"; do
            NAME="$(basename "$ENC" .enc)"
            [ "$ENC" = cloud/xianyu-state.enc ] && NAME=Nil
            [[ "$NAME" =~ ^[A-Za-z0-9_-]{1,32}$ ]] || continue
            REPO_TMP=".xianyu-tmp/$NAME-repo.json"
            ROLL_TMP=".xianyu-tmp/$NAME-rolling.json"
            openssl enc -d -aes-256-cbc -pbkdf2 -in "$ENC" -out "$REPO_TMP" -pass env:XIANYU_STATE_PASSWORD || true
            ROLL_ENC=".state/xianyu-accounts/$NAME.enc"
            [ "$NAME" = Nil ] && [ -f .state/xianyu-state.enc ] && ROLL_ENC=.state/xianyu-state.enc
            if [ -f "$ROLL_ENC" ]; then
              openssl enc -d -aes-256-cbc -pbkdf2 -in "$ROLL_ENC" -out "$ROLL_TMP" -pass env:XIANYU_STATE_PASSWORD || true
            fi
            node scripts/xianyu-pick-state.mjs ".xianyu/state/$NAME.json" "$REPO_TMP" "$ROLL_TMP" || true
          done
          mkdir -p lh-upload/xianyu-accounts
          VALID=0
          RISK=0
          for STATE in .xianyu/state/*.json; do
            NAME="$(basename "$STATE" .json)"
            STATUS_FILE=".xianyu-tmp/$NAME.status"
            GITHUB_ENV= XIANYU_STATUS_FILE="$STATUS_FILE" node scripts/xianyu-keepalive.mjs "$STATE" || true
            STATUS="$(cat "$STATUS_FILE" 2>/dev/null || echo error)"
            [ "$STATUS" = ok ] && VALID=$((VALID+1))
            [ "$STATUS" = risk_control ] && RISK=1
            openssl enc -aes-256-cbc -salt -pbkdf2 -in "$STATE" -out "lh-upload/xianyu-accounts/$NAME.enc" -pass env:XIANYU_STATE_PASSWORD
            [ "$NAME" = Nil ] && cp "lh-upload/xianyu-accounts/$NAME.enc" lh-upload/xianyu-state.enc
            echo "Xianyu account $NAME: $STATUS"
          done
          if [ "$RISK" -eq 1 ]; then
            echo "XIANYU_SESSION_STATUS=risk_control" >> "$GITHUB_ENV"
          elif [ "$VALID" -gt 0 ]; then
            echo "XIANYU_SESSION_STATUS=ok" >> "$GITHUB_ENV"
          else
            echo "XIANYU_SESSION_STATUS=expired" >> "$GITHUB_ENV"
          fi
          echo "XIANYU_STATE_DIR=$PWD/.xianyu/state" >> "$GITHUB_ENV"
          rm -rf .xianyu-tmp
          # Modo directo (por defecto): Luxury Hunter lee solo la página de
          # resultados con las cookies guardadas; no hace falta el conector
          # Docker, que abría cada ficha y provocaba la verificación anti-bot.
          if [ "${XIANYU_MODE:-direct}" != "connector" ]; then
            if [ -f .xianyu/state/Nil.json ]; then
              echo "XIANYU_STATE_FILE=$PWD/.xianyu/state/Nil.json" >> "$GITHUB_ENV"
            fi
            echo "Xianyu direct mode ready ($VALID available accounts)"
            exit 0
          fi
          if [ "$VALID" -eq 0 ]; then
            echo "Xianyu session is not valid; skipping Xianyu in this run."
            exit 0
          fi
          # Base de datos del conector de la ejecución anterior: los anuncios ya
          # vistos se saltan al instante y solo se procesan los nuevos.
          if [ -f .state/xianyu-app.sqlite3 ]; then
            cp .state/xianyu-app.sqlite3 .xianyu/data/app.sqlite3
            echo "Restored Xianyu connector database"
          fi
          cd .xianyu
          cp .env.example .env
          # docker --env-file no quita comillas: PROXY_URL="" se convertía en el
          # proxy literal "" y el navegador fallaba con ERR_PROXY_CONNECTION_FAILED.
          sed -i -E 's/^([A-Za-z_][A-Za-z0-9_]*)="(.*)"$/\1=\2/' .env
          # Luxury Hunter uses Xianyu only as a crawler here; central AI remains in Luxury Hunter.
          docker pull ghcr.io/usagi-org/ai-goofish:latest
          docker run -d --name luxury-hunter-xianyu --init -p 8000:8000 \
            --env-file .env \
            -e APP_DATABASE_FILE=/app/data/app.sqlite3 \
            -v "$PWD/.env:/app/.env" \
            -v "$PWD/data:/app/data" \
            -v "$PWD/state:/app/state" \
            -v "$PWD/config.json:/app/config.json" \
            -v "$PWD/prompts:/app/prompts" \
            -v "$PWD/jsonl:/app/jsonl" \
            -v "$PWD/logs:/app/logs" \
            -v "$PWD/images:/app/images" \
            -v "$PWD/price_history:/app/price_history" \
            ghcr.io/usagi-org/ai-goofish:latest
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then echo "Xianyu ready"; exit 0; fi
            sleep 2
          done
          echo "Xianyu did not become ready. Continuing with other sources."
          docker logs luxury-hunter-xianyu --tail 80 || true

      - name: Run due tasks
        run: node scripts/github-run.mjs

      # Si Goofish dio la sesión por caducada o bloqueó la búsqueda, se envía
      # un QR a Telegram para renovarla escaneando con la app (máx. 1 vez / 20 h).
      - name: Xianyu QR renewal if needed
        if: always()
        env:
          XIANYU_STATE_PASSWORD: ${{ secrets.XIANYU_STATE_PASSWORD }}
        shell: bash
        run: |
          if [ ! -f .xianyu/state/Nil.json ] || [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then exit 0; fi
          if [ "${XIANYU_SESSION_STATUS:-}" != "expired" ] && [ ! -f .xianyu-needs-login ]; then
            echo "Xianyu session fine; no QR needed."; exit 0
          fi
          LAST=0
          [ -f .state/xianyu-qr-last ] && LAST=$(cat .state/xianyu-qr-last)
          NOW=$(date +%s)
          mkdir -p lh-upload
          echo "$LAST" > lh-upload/xianyu-qr-last
          if [ $((NOW-LAST)) -lt 72000 ]; then
            echo "QR already requested in the last 20 h; skipping."; exit 0
          fi
          echo "$NOW" > lh-upload/xianyu-qr-last
          if node scripts/xianyu-qr-login.mjs .xianyu/state/Nil.json 4; then
            openssl enc -aes-256-cbc -salt -pbkdf2 -in .xianyu/state/Nil.json -out lh-upload/xianyu-state.enc -pass env:XIANYU_STATE_PASSWORD
            mkdir -p lh-upload/xianyu-accounts
            cp lh-upload/xianyu-state.enc lh-upload/xianyu-accounts/Nil.enc
            echo "New Xianyu session saved."
          fi

      - name: Collect persistent state
        if: always()
        shell: bash
        run: |
          mkdir -p lh-upload
          cp data/luxury-hunter.sqlite3 lh-upload/
          if [ -f .xianyu/data/app.sqlite3 ]; then
            docker stop luxury-hunter-xianyu >/dev/null 2>&1 || true
            cp .xianyu/data/app.sqlite3 lh-upload/xianyu-app.sqlite3 || true
          fi
          # Si esta ejecución no renovó la sesión de Xianyu, conserva la anterior.
          if [ ! -f lh-upload/xianyu-state.enc ] && [ -f .state/xianyu-state.enc ]; then
            cp .state/xianyu-state.enc lh-upload/
          fi
          mkdir -p lh-upload/xianyu-accounts
          for ENC in .state/xianyu-accounts/*.enc; do
            [ -f "$ENC" ] || continue
            [ -f "lh-upload/xianyu-accounts/$(basename "$ENC")" ] || cp "$ENC" lh-upload/xianyu-accounts/
          done
          if [ ! -f lh-upload/xianyu-qr-last ] && [ -f .state/xianyu-qr-last ]; then
            cp .state/xianyu-qr-last lh-upload/
          fi

      - name: Save persistent state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luxury-hunter-state
          path: lh-upload/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      # Encadena la siguiente ejecución al terminar (cobertura continua) si
      # la variable de repositorio SELF_CHAIN vale 'true'. El cron sigue como red de seguridad.
      - name: Chain next run
        if: always() && vars.SELF_CHAIN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run luxury-hunter.yml --ref "${GITHUB_REF_NAME}" || echo "Could not chain next run"

      - name: Xianyu logs
        if: always()
        shell: bash
        run: |
          docker logs luxury-hunter-xianyu --tail 60 2>/dev/null | grep -v "GET /health" || echo "Xianyu connector was not started"
          # Logs del buscador interno de Xianyu (una búsqueda por fichero).
          for f in $(ls -t .xianyu/logs/*.log 2>/dev/null | head -3); do
            echo "===== $f ====="
            tail -60 "$f"
          done
