name: Luxury Hunter hourly

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: luxury-hunter-scheduled
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      # IA: OpenAI si existe OPENAI_API_KEY; si no, Gemini.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6.1-sol' }}
      OPENAI_TRIAGE_MODEL: ${{ vars.OPENAI_TRIAGE_MODEL || 'gpt-6-luna' }}
      AI_TRIAGE_MIN_SCORE: ${{ vars.AI_TRIAGE_MIN_SCORE || '60' }}
      # Tope de gasto diario en OpenAI (USD). Al alcanzarlo se deja de analizar hasta mañana.
      AI_DAILY_BUDGET_USD: ${{ vars.AI_DAILY_BUDGET_USD || '1' }}
      # Verificación cara (fotos + búsqueda web) solo para BUY/STRONG BUY o WATCH con esta puntuación.
      VERIFY_WATCH_MIN_SCORE: ${{ vars.VERIFY_WATCH_MIN_SCORE || '70' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Fuentes por API oficial (se activan solas si existen los secretos).
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_MARKETPLACES: ${{ vars.EBAY_MARKETPLACES || 'EBAY_DE,EBAY_FR,EBAY_IT,EBAY_ES,EBAY_GB,EBAY_US' }}
      # 'cost' (prudente) o 'deductible' si la empresa deduce el IVA de importación.
      IMPORT_VAT_MODE: ${{ vars.IMPORT_VAT_MODE || 'cost' }}
      GOOGLE_CLOUD_VISION_API_KEY: ${{ secrets.GOOGLE_CLOUD_VISION_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      XIANYU_BASE_URL: http://127.0.0.1:8000
      XIANYU_MAX_QUERIES: ${{ vars.XIANYU_MAX_QUERIES || '1' }}
      XIANYU_QUERY_TIMEOUT_SEC: ${{ vars.XIANYU_QUERY_TIMEOUT_SEC || '180' }}
      BUNJANG_MAX_QUERIES: ${{ vars.BUNJANG_MAX_QUERIES || '2' }}
      BUYEE_MAX_QUERIES: ${{ vars.BUYEE_MAX_QUERIES || '2' }}
      PORT: '8200'
      # Velocidad: tareas en paralelo y ciclos repetidos dentro de cada ejecución.
      TASK_CONCURRENCY: ${{ vars.TASK_CONCURRENCY || '3' }}
      LOOP_MINUTES: ${{ vars.LOOP_MINUTES || '0' }}
      CYCLE_MIN_MINUTES: ${{ vars.CYCLE_MIN_MINUTES || '20' }}
      # Avisos inmediatos (email siempre; Telegram si hay secretos).
      INSTANT_ALERT_DECISIONS: ${{ vars.INSTANT_ALERT_DECISIONS || 'STRONG BUY,BUY' }}
      INSTANT_ALERT_MIN_PROFIT_EUR: ${{ vars.INSTANT_ALERT_MIN_PROFIT_EUR || '' }}
      AI_MAX_ITEMS_PER_TASK_RUN: ${{ vars.AI_MAX_ITEMS_PER_TASK_RUN || '5' }}
      # Informe: uno al día a partir de esta hora (Europe/Madrid).
      DIGEST_SCHEDULE: ${{ vars.DIGEST_SCHEDULE || 'daily' }}
      DIGEST_DAILY_HOUR: ${{ vars.DIGEST_DAILY_HOUR || '9' }}
      GLOBAL_EMAIL_TO: ${{ secrets.GLOBAL_EMAIL_TO }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Decrypt Luxury Hunter cloud configuration
        env:
          LUXURY_CONFIG_PASSWORD: ${{ secrets.LUXURY_CONFIG_PASSWORD }}
        shell: bash
        run: |
          if [ ! -f cloud/config.enc ]; then
            echo "Missing cloud/config.enc" >&2
            exit 1
          fi
          if [ -z "${LUXURY_CONFIG_PASSWORD:-}" ]; then
            echo "Missing GitHub secret LUXURY_CONFIG_PASSWORD" >&2
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -in cloud/config.enc -out cloud/config.json -pass env:LUXURY_CONFIG_PASSWORD

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore previous Luxury Hunter state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p .state data
          RESTORED_RUN=""

          for PREV_RUN in $(gh run list --workflow luxury-hunter.yml --limit 20 --json databaseId -q '.[].databaseId' 2>/dev/null || true); do
            if [ "$PREV_RUN" = "${GITHUB_RUN_ID:-}" ]; then
              continue
            fi

            rm -rf .state/*

            if gh run download "$PREV_RUN" -n luxury-hunter-state -D .state >/dev/null 2>&1; then
              if [ -f .state/luxury-hunter.sqlite3 ]; then
                cp .state/luxury-hunter.sqlite3 data/luxury-hunter.sqlite3
                RESTORED_RUN="$PREV_RUN"
                echo "Restored persistent state from run $PREV_RUN"
                break
              fi
            fi
          done

          if [ -z "$RESTORED_RUN" ]; then
            echo "No previous persistent state artifact was available."
          fi

      - name: Install Luxury Hunter dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for Bunjang
        run: npx playwright install --with-deps chromium

      - name: Start Xianyu connector when encrypted state is configured
        env:
          XIANYU_STATE_PASSWORD: ${{ secrets.XIANYU_STATE_PASSWORD }}
        shell: bash
        run: |
          if [ ! -f cloud/xianyu-state.enc ] || [ -z "${XIANYU_STATE_PASSWORD:-}" ]; then
            echo "Xianyu cloud state not configured; Xianyu connector will be unavailable in this run."
            echo "XIANYU_SESSION_STATUS=missing" >> "$GITHUB_ENV"
            exit 0
          fi
          git clone --depth 1 https://github.com/wangdaguo/ai-goofish-monitor.git .xianyu
          mkdir -p .xianyu/state .xianyu/data .xianyu/logs .xianyu/images .xianyu/jsonl .xianyu/price_history .xianyu-tmp
          # Candidatas: la del repo (último login manual) y la renovada en la ejecución anterior.
          openssl enc -d -aes-256-cbc -pbkdf2 -in cloud/xianyu-state.enc -out .xianyu-tmp/repo.json -pass env:XIANYU_STATE_PASSWORD || true
          if [ -f .state/xianyu-state.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in .state/xianyu-state.enc -out .xianyu-tmp/rolling.json -pass env:XIANYU_STATE_PASSWORD || true
          fi
          node scripts/xianyu-pick-state.mjs .xianyu/state/Nil.json .xianyu-tmp/repo.json .xianyu-tmp/rolling.json || true
          rm -rf .xianyu-tmp
          # Renueva cookies visitando Goofish con la sesión guardada.
          XS=0
          node scripts/xianyu-keepalive.mjs .xianyu/state/Nil.json || XS=$?
          if [ -f .xianyu/state/Nil.json ]; then
            mkdir -p lh-upload
            openssl enc -aes-256-cbc -salt -pbkdf2 -in .xianyu/state/Nil.json -out lh-upload/xianyu-state.enc -pass env:XIANYU_STATE_PASSWORD
          fi
          if [ "$XS" != "0" ]; then
            echo "Xianyu session is not valid; skipping the Xianyu connector in this run."
            exit 0
          fi
          # Base de datos del conector de la ejecución anterior: los anuncios ya
          # vistos se saltan al instante y solo se procesan los nuevos.
          if [ -f .state/xianyu-app.sqlite3 ]; then
            cp .state/xianyu-app.sqlite3 .xianyu/data/app.sqlite3
            echo "Restored Xianyu connector database"
          fi
          cd .xianyu
          cp .env.example .env
          # docker --env-file no quita comillas: PROXY_URL="" se convertía en el
          # proxy literal "" y el navegador fallaba con ERR_PROXY_CONNECTION_FAILED.
          sed -i -E 's/^([A-Za-z_][A-Za-z0-9_]*)="(.*)"$/\1=\2/' .env
          # Luxury Hunter uses Xianyu only as a crawler here; central AI remains in Luxury Hunter.
          docker pull ghcr.io/usagi-org/ai-goofish:latest
          docker run -d --name luxury-hunter-xianyu --init -p 8000:8000 \
            --env-file .env \
            -e APP_DATABASE_FILE=/app/data/app.sqlite3 \
            -v "$PWD/.env:/app/.env" \
            -v "$PWD/data:/app/data" \
            -v "$PWD/state:/app/state" \
            -v "$PWD/config.json:/app/config.json" \
            -v "$PWD/prompts:/app/prompts" \
            -v "$PWD/jsonl:/app/jsonl" \
            -v "$PWD/logs:/app/logs" \
            -v "$PWD/images:/app/images" \
            -v "$PWD/price_history:/app/price_history" \
            ghcr.io/usagi-org/ai-goofish:latest
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then echo "Xianyu ready"; exit 0; fi
            sleep 2
          done
          echo "Xianyu did not become ready. Continuing with other sources."
          docker logs luxury-hunter-xianyu --tail 80 || true

      - name: Run due tasks
        run: node scripts/github-run.mjs

      - name: Collect persistent state
        if: always()
        shell: bash
        run: |
          mkdir -p lh-upload
          cp data/luxury-hunter.sqlite3 lh-upload/
          if [ -f .xianyu/data/app.sqlite3 ]; then
            docker stop luxury-hunter-xianyu >/dev/null 2>&1 || true
            cp .xianyu/data/app.sqlite3 lh-upload/xianyu-app.sqlite3 || true
          fi
          # Si esta ejecución no renovó la sesión de Xianyu, conserva la anterior.
          if [ ! -f lh-upload/xianyu-state.enc ] && [ -f .state/xianyu-state.enc ]; then
            cp .state/xianyu-state.enc lh-upload/
          fi

      - name: Save persistent state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luxury-hunter-state
          path: lh-upload/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      # Encadena la siguiente ejecución al terminar (cobertura continua) si
      # la variable de repositorio SELF_CHAIN vale 'true'. El cron sigue como red de seguridad.
      - name: Chain next run
        if: always() && vars.SELF_CHAIN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run luxury-hunter.yml --ref "${GITHUB_REF_NAME}" || echo "Could not chain next run"

      - name: Xianyu logs
        if: always()
        shell: bash
        run: |
          docker logs luxury-hunter-xianyu --tail 60 2>/dev/null | grep -v "GET /health" || echo "Xianyu connector was not started"
          # Logs del buscador interno de Xianyu (una búsqueda por fichero).
          for f in $(ls -t .xianyu/logs/*.log 2>/dev/null | head -3); do
            echo "===== $f ====="
            tail -60 "$f"
          done
