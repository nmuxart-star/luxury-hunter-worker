name: Telegram check

# Envía un mensaje de prueba con los secrets de Telegram. No usa IA.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          code=$(curl -s -o resp.json -w '%{http_code}' -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="✅ Luxury Hunter (GitHub) conectado: las alertas llegarán aquí.")
          echo "HTTP $code"
          grep -o '"ok":[a-z]*' resp.json || true
          grep -o '"description":"[^"]*"' resp.json || true
          test "$code" = 200
