name: Luxury Hunter watchdog

# Vigila que el bot no se quede parado (caída de GitHub, ejecución atascada, cadena rota) y lo relanza.
# Corre en un servidor de GitHub, no en el del bot. Para pararlo a propósito: desactiva «Luxury Hunter hourly»
# o pon la variable del repositorio BOT_PAUSED=true.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: luxury-hunter-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      REF: ${{ github.event.repository.default_branch }}
      BOT_PAUSED: ${{ vars.BOT_PAUSED }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the bot and relaunch it if it stopped
        run: node scripts/watchdog.mjs
